<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Team | GARUDA</title>
  <meta name="description" content="The engineers, designers, and operators behind GARUDA's super-mileage vehicles.">
  <link rel="icon" href="favicon.ico">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/pages/team.css">
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/pages/team.js" defer></script>
</head>
<body>
<main id="main">

  <section class="page-hero">
    <img class="page-hero-img" src="assets/images/core_team_with_car.jpg" alt="" width="1000" height="1000" fetchpriority="high">
    <div class="container">
      <h1>The <em>team.</em></h1>
      <p class="lead">The students building the current car.</p>
    </div>
  </section>

  <!-- Member cards are filled in from assets/data/team.json -->

  <!-- Leadership: the faculty in-charge and the captain, side by side -->
  <section class="section">
    <div class="container">
      <div class="head"><h2>Leadership</h2></div>
      <div class="leads">
        <div data-reveal>
          <h3 class="group-title">Faculty in-charge</h3>
          <div id="faculty"></div>
        </div>
        <div data-reveal style="--i: 1">
          <h3 class="group-title">Captain</h3>
          <div id="captain"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- The three departments, side by side as equals -->
  <section class="section">
    <div class="container">
      <div class="head"><h2>Verticals:</h2></div>
      <div class="departments">
        <div data-reveal>
          <h3 class="group-title">Mechanical</h3>
          <div class="members" id="mechanical"></div>
        </div>
        <div data-reveal style="--i: 1">
          <h3 class="group-title">Electrical</h3>
          <div class="members" id="electrical"></div>
        </div>
        <div data-reveal style="--i: 2">
          <h3 class="group-title">Management</h3>
          <div class="members" id="management"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Alumni: the people who built the earlier cars, listed by batch -->
  <section class="section" id="alumni-section" hidden>
    <div class="container">
      <div class="head"><h2>Alumni</h2></div>
      <div class="alumni" id="alumni" data-reveal></div>
    </div>
  </section>

</main>
</body>
</html>
