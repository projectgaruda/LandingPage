<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | GARUDA</title>
  <meta name="description" content="Two decades of GARUDA: prototypes, workshop hours, race days, awards, and the crews that built it all.">
  <link rel="icon" href="favicon.ico">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/pages/gallery.css">
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/pages/gallery.js" defer></script>
</head>
<body>
<main id="main">

  <section class="page-hero">
    <img class="page-hero-img" src="assets/images/SEM_2015.jpg" alt="" width="960" height="638" fetchpriority="high">
    <div class="container">
      <h1>Two decades, <em>frame by frame.</em></h1>
      <p class="lead">
        Prototypes from the workshop floor, race-day photos from
        international circuits, award nights, and the rotating crews of
        undergraduates that have carried the team since 2006. Click any
        photo to enlarge.
      </p>
    </div>
  </section>

  <!-- Photos come from assets/data/gallery.json -->
  <section class="section">
    <div class="container">
      <div class="gallery-bar">
        <h2>Browse the archive.</h2>
        <div class="filters" role="tablist" aria-label="Filter by category"></div>
      </div>
      <div class="gallery-grid"></div>
      <p class="gallery-empty muted" hidden>No photos in this category yet.</p>
    </div>
  </section>

</main>
</body>
</html>
